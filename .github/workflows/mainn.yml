name: Keep Space awake

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Hugging Face Space
        run: |
          curl -fsSL --max-time 90 --retry 5 --retry-delay 15 --retry-all-errors \
            "https://hemel24-lenspilotwebpage.hf.space/" -o /dev/null
